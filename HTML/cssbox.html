<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Box Model</title>

    <style>
        body {
            font-family:cursive;
            background-color: lightblue;
        }

        .box {
            width: 300px;              
            background-color: tomato; 
            padding: 20px;             
            border: 5px solid slateblue; 
            margin: 30px;              
        }
        }
    </style>
</head>

<body>

    <h2 class="title">CSS Box Model Demonstration</h2>

    <div class="box">
        This area represents the <b>content</b> of the box.  
        The space between the content and border is called <b>padding</b>.  
        The line around the padding is the <b>border</b>.  
        The space outside the border is called <b>margin</b>.
    </div>

</body>
</html>
