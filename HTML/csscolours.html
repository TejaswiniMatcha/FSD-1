<!DOCTYPE html>
<html>
<head>
    <title>CSS Color References</title>
    <style>
        .color-name {
            color: tomato;
        }
        .hex-color {
            color: #616161;
        }
        .rgb-color {
            color: rgb(238, 130,238); 
        }
        .rgba-color {
            color: rgba(0, 255, 255, 0.6);        }

        .hsl-color {
            color: hsl(0, 100%, 75%);
        }

        .hsla-color {
            color: hsla(300, 100%, 50%, 1); 
        }
    </style>

</head>
<body>

    <h2>Different Ways to Reference Colors in CSS</h2>

    <p class="color-name">This text uses a color name.</p>

    <p class="hex-color">This text uses a hexadecimal color.</p>

    <p class="rgb-color">This text uses an RGB color.</p>

    <p class="rgba-color">This text uses an RGBA color.</p>

    <p class="hsl-color">This text uses an HSL color.</p>

    <p class="hsla-color">This text uses an HSLA color.</p>

</body>
</html>
