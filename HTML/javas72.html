<!DOCTYPE html>
<html>
<head>
    <title>Window Object Demo</title>

    <script>
        function showDetails()
        {
            // Using window method
            alert("Welcome to Window Object Example!");

            var name = prompt("Enter your name:");

            var result = confirm("Do you want to see window size?");

            if(result == true)
            {
                // Using window properties
                var height = window.innerHeight;
                var width = window.innerWidth;

                document.getElementById("info").innerHTML =
                "Hello " + name + "<br>Window Height: " + height +
                "<br>Window Width: " + width;
            }
            else
            {
                document.getElementById("info").innerHTML =
                "You cancelled the operation.";
            }
        }

        function openWindow()
        {
            window.open("https://www.thomaskinkade.com/collections/disney-tangled-by-thomas-kinkade-studios?srsltid=AfmBOop4db4Ptw2pcPIooM4D2Gepf318Cwr8-E09bt96sZen7gfjLpdF");
        }
    </script>
</head>

<body>

<h2>Window Object Properties and Methods</h2>

<button onclick="showDetails()">Click Here</button>
<button onclick="openWindow()">Open New Window</button>

<p id="info"></p>

</body>
</html>
