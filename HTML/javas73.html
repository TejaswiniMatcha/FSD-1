<!DOCTYPE html>
<html>
<head>
    <title>Array Object Demo</title>

    <script>
        function arrayDemo()
        {
            // Creating an array
            var fruits = ["Apple", "Mango", "Banana"];

            // Using length property
            document.getElementById("p1").innerHTML =
            "Array Length: " + fruits.length;

            // Using push() method
            fruits.push("Orange");
            document.getElementById("p2").innerHTML =
            "After push(): " + fruits;

            // Using pop() method
            fruits.pop();
            document.getElementById("p3").innerHTML =
            "After pop(): " + fruits;

            // Using unshift() method
            fruits.unshift("Grapes");
            document.getElementById("p4").innerHTML =
            "After unshift(): " + fruits;

            // Using shift() method
            fruits.shift();
            document.getElementById("p5").innerHTML =
            "After shift(): " + fruits;

            // Using sort() method
            fruits.sort();
            document.getElementById("p6").innerHTML =
            "After sort(): " + fruits;
        }
    </script>
</head>

<body>

<h2>Array Object Properties and Methods</h2>

<button onclick="arrayDemo()">Click Here</button>

<p id="p1"></p>
<p id="p2">
