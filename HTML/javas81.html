<!DOCTYPE html>
<html>
<head>
    <title>Largest Number Program</title>
</head>
<body>

<h2>Find the Larger Number</h2>

<script>
    var num1 = parseInt(prompt("Enter first integer:"));
    var num2 = parseInt(prompt("Enter second integer:"));
    var num3 = parseInt(prompt("Enter third integer:"));
    if (num1 == num2 && num2 == num3) {
        alert("EQUAL NUMBERS");
    }
    else {
        var largest = num1;

        if (num2 > largest) {
            largest = num2;
        }
        if (num3 > largest) {
            largest = num3;
        }

        alert(largest + " LARGER NUMBER");
    }
</script>

</body>
</html>
