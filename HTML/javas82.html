<!DOCTYPE html>
<html>
<head>
    <title>Display Week Days</title>
</head>
<body>

<h2>Display Week Day</h2>

<script>
    var day = parseInt(prompt("Enter a number (1-7):"));
    var result;

    switch(day)
    {
        case 1:
            result = "Sunday";
            break;

        case 2:
            result = "Monday";
            break;

        case 3:
            result = "Tuesday";
            break;

        case 4:
            result = "Wednesday";
            break;

        case 5:
            result = "Thursday";
            break;

        case 6:
            result = "Friday";
            break;

        case 7:
            result = "Saturday";
            break;

        default:
            result = "Invalid input! Please enter a number between 1 and 7.";
    }

    alert(result);
</script>

</body>
</html>
