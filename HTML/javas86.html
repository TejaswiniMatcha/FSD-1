<!DOCTYPE html>
<html>
<head>
    <title>Bank Denomination Program</title>
</head>
<body>

<h2>Bank Amount Denomination</h2>

<script>
    var amount = parseInt(prompt("Enter the deposited amount:"));

    var hundreds = Math.floor(amount / 100);
    amount = amount % 100;

    var fifties = Math.floor(amount / 50);
    amount = amount % 50;

    var twenties = Math.floor(amount / 20);
    amount = amount % 20;

    var tens = Math.floor(amount / 10);
    amount = amount % 10;

    var fives = Math.floor(amount / 5);
    amount = amount % 5;

    var twos = Math.floor(amount / 2);
    amount = amount % 2;

    var ones = amount;

    document.write("<h3>Denomination:</h3>");
    document.write(hundreds + " - 100's <br>");
    document.write(fifties + " - 50's <br>");
    document.write(twenties + " - 20's <br>");
    document.write(tens + " - 10's <br>");
    document.write(fives + " - 5's <br>");
    document.write(twos + " - 2's <br>");
    document.write(ones + " - 1's <br>");
</script>

</body>
</html>
