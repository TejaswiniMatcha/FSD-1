<!DOCTYPE html>
<html>
<body>

<h3>Number Operations</h3>

Enter Number:
<input type="number" id="n">
<button onclick="show()">Submit</button>

<p id="out"></p>

<script>

function factorial(n){
 let f=1;
 for(let i=1;i<=n;i++) f*=i;
 return f;
}

function fibonacci(n){
 let a=0,b=1,s="0 1 ";
 for(let i=2;i<n;i++){
  let c=a+b;
  s+=c+" ";
  a=b; b=c;
 }
 return s;
}

function primes(n){
 let p="";
 for(let i=2;i<=n;i++){
  let flag=1;
  for(let j=2;j<i;j++)
   if(i%j==0) flag=0;
  if(flag) p+=i+" ";
 }
 return p;
}

function palindrome(n){
 let r=0,t=n;
 while(t>0){
  r=r*10+t%10;
  t=Math.floor(t/10);
 }
 return (r==n)?"Palindrome":"Not Palindrome";
}

function show(){
 let n=parseInt(document.getElementById("n").value);
 document.getElementById("out").innerHTML =
 "Factorial: "+factorial(n)+"<br>"+
 "Fibonacci: "+fibonacci(n)+"<br>"+
 "Primes: "+primes(n)+"<br>"+
 palindrome(n);
}

</script>

</body>
</html>
