<!DOCTYPE html>
<html>
<head>
<title>CSS Selectors</title>

<style>
p {color:red;}        /* element */
#id1 {color:blue;}    /* id */
.cls {color:green;}   /* class */
h1, h2 {color:purple;} /* group */
* {margin:0;}         /* universal */
</style>

</head>

<body>

<h1>Heading One</h1>
<h2>Heading Two</h2>

<p>This paragraph uses element selector.</p>

<p id="id1">This paragraph uses id selector.</p>

<p class="cls">This paragraph uses class selector.</p>

</body>
</html>
